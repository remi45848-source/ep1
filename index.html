  {type:'text',tone:'tone-silence',text:'<p>There were no screams.</p><p class="emphasis">Only the bewildered gaze of those who could not yet comprehend their own dying.</p>'},

  {type:'text',tone:'tone-revelation',text:'<p>And this prosperity \u2014 upon what foundation did it rest?</p>'},
  {type:'text',tone:'tone-power-before',text:'<p class="emphasis">The Dalton dynasty. A political aristocracy.</p><p>The grandfather, a veteran senator who shaped legislation for decades. The mother, who ascended to the vice presidency itself.</p><p>There was no door in this nation that would not open at their name.</p>'},
  {type:'interactive',tone:''},
  {type:'text',tone:'tone-power-before',text:'<p>Through every scandal, every tempest, they survived \u2014 shielded by the vast, invisible web of those who owed them favors.</p>'},
  {type:'text',tone:'tone-power-before',text:'<p>Billions in flood-relief funds, vanished without a trace.</p><p>The blood of countless lives, crushed beneath the weight of their impunity.</p><p class="emphasis">And still, they walked free.</p>'},
  {type:'text',tone:'tone-power-before',text:'<p>But today \u2014 would that fortune hold?</p>'},

  {type:'text',tone:'tone-execution',text:'<p>Thirty minutes. Forty-seven lives.</p>'},

  {type:'text',tone:'tone-aftermath',text:'<p>The air hung thick with the scent of iron and gunpowder.</p>'},
  {type:'text',tone:'tone-aftermath',text:'<p class="emphasis">The entire world held its breath.</p>'},
  {type:'text',tone:'tone-revelation',text:'<p>Now, nothing would ever be the same.</p>'},
  {type:'text',tone:'tone-aftermath',text:'<p class="emphasis">One hour later.</p>'},

  function bD(){dPd=false;dEl.style.position='fixed';dEl.style.left=dOR.left+'px';dEl.style.top=dOR.top+'px';dEl.style.width=dOR.width+'px';dEl.style.height=dOR.height+'px';dEl.style.transition='none';dEl.style.margin='0';dEl.classList.add('dragging');document.body.appendChild(dEl);sx('ds');dG();}

  function oU(){if(!dEl)return;if(dPd){dPd=false;dEl=null;return;}var f=dEl,fid=parseInt(f.dataset.id);dEl=null;f.classList.remove('dragging');dz.classList.remove('hover');var d=dz.getBoundingClientRect(),fr=f.getBoundingClientRect(),dist=Math.hypot(fr.left+fr.width/2-(d.left+d.width/2),fr.top+fr.height/2-(d.top+d.height/2));if(dist<d.width/2+30&&!col[fid]&&!insp){f.classList.add('locked');f.style.transition='all .5s';f.style.left=(d.left+d.width/2-fr.width/2)+'px';f.style.top=(d.top+d.height/2-fr.height/2)+'px';f.style.transform='scale(1.4) rotateZ(-8deg)';f.style.opacity='.7';setTimeout(function(){insF(fid,f);},500);}else{rF(f);}}

  pr.addEventListener('click',function(){if(cIdx>0){sS(cIdx-1,true);sx('pf');}});
  nx.addEventListener('click',function(){if(cIdx<cLen-1){sS(cIdx+1,true);sx('pf');}});
  tk.addEventListener('scroll',function(){var w=tk.clientWidth,ni=Math.round(tk.scrollLeft/w);if(ni!==cIdx&&ni>=0&&ni<cLen){cIdx=ni;var ds=dt.querySelectorAll('.ix-dot');for(var d=0;d<ds.length;d++)ds[d].classList.toggle('active',d===ni);}});
  function insF(id,fEl){
    insp=true;cI=id;iL=0;var ev=ED[id],it=ev.i;cLen=it.length;cIdx=0;pt.textContent=ev.t;

function preloadAround(i){var r=[i-1,i,i+1,i+2];for(var x=0;x<r.length;x++){var j=r[x];if(j<0||j>=states.length||states[j].type!=='video')continue;var v=videoElements[j];if(!v.getAttribute('src')){v.setAttribute('src',states[j].src);v.load();}}}
function safePlay(v,cb){v.muted=true;var p=v.play();if(p!==undefined){p.then(function(){v.muted=false;if(cb)cb();}).catch(function(){var done=false;var t=setTimeout(function(){if(!done){done=true;if(cb)cb();}},8000);v.addEventListener('canplay',function oC(){v.removeEventListener('canplay',oC);if(done)return;clearTimeout(t);done=true;v.muted=true;var r=v.play();if(r!==undefined)r.then(function(){v.muted=false;}).catch(function(){});if(cb)cb();});});}else{if(cb)cb();}}
var started=false,fvPP=false;
function startExperience(){if(started)return;started=true;try{ambientAudio.play();ambientAudio.volume=.3;}catch(e){}var fv=videoElements[0];if(fv){fv.setAttribute('src',states[0].src);fv.load();fv.muted=true;var p=fv.play();if(p!==undefined)p.then(function(){fvPP=true;}).catch(function(){});}preloadAround(0);document.getElementById('startOverlay').classList.add('hidden');setTimeout(function(){gotoState(0);},300);}
function setupVideoEnd(v,el,i){if(i===20){var ct=setInterval(function(){if(v.duration&&v.currentTime>=v.duration-2){clearInterval(ct);el.style.transition='opacity 2s ease-out';el.classList.add('fade-out');}},100);v.onended=function(){clearInterval(ct);el.style.transition='';el.classList.remove('fade-out');if(i<states.length-1)gotoState(i+1);};}else{v.onended=function(){if(i<states.length-1){el.style.transition='opacity 1.1s ease-out';el.classList.add('fade-out');setTimeout(function(){el.style.transition='';el.classList.remove('fade-out');gotoState(i+1);},1100);}};}}

function gotoState(index){
  if(index<0||index>=states.length||isTransitioning)return;
  if(interactiveActive&&currentIndex===6){var xf=document.getElementById('ixFA');if(!xf||!xf.classList.contains('active'))return;}
  isTransitioning=true;
  var prev=currentIndex>=0?states[currentIndex]:null,next=states[index];
  if(prev&&prev.type==='video'&&videoElements[currentIndex])videoElements[currentIndex].pause();
  if(currentIndex===6)interactiveActive=false;
  var all=document.querySelectorAll('.state');for(var s=0;s<all.length;s++){all[s].classList.remove('active');all[s].classList.remove('fade-in-slow');}
  var ae=document.querySelector('[data-index="'+index+'"]');ae.classList.add('active');
  if(index===20)ae.classList.add('fade-in-slow');

  if(next.type==='video'){if(index===3)fadeAmbient(0);else fadeAmbient(.3);var v=videoElements[index],ld=document.getElementById('loader_'+index),se=ae;v.onended=null;if(!v.getAttribute('src')){v.setAttribute('src',next.src);v.load();}if(ld)ld.classList.remove('hidden');if(index===0&&fvPP){fvPP=false;v.muted=false;if(ld)ld.classList.add('hidden');setupVideoEnd(v,se,index);}else{v.currentTime=0;safePlay(v,function(){if(ld)ld.classList.add('hidden');setupVideoEnd(v,se,index);});}}

  setTimeout(function(){isTransitioning=false;},800);
}
function fadeAmbient(tg){clearInterval(window.fadeInterval);window.fadeInterval=setInterval(function(){var c=ambientAudio.volume;if(Math.abs(c-tg)<.02){ambientAudio.volume=tg;clearInterval(window.fadeInterval);}else{ambientAudio.volume+=tg>c?.02:-.02;}},50);}
var sCd=false;
window.addEventListener('wheel',function(e){if(interactiveActive||sCd)return;sCd=true;if(e.deltaY>0)gotoState(currentIndex+1);else if(e.deltaY<0)gotoState(currentIndex-1);setTimeout(function(){sCd=false;},1200);},{passive:true});
