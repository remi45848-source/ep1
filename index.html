<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Fall of the Powerful — Episode One</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Cormorant Garamond', 'Georgia', serif; background: #0a0a0a; color: #e8e8e8; font-weight: 300; }
        
        #startOverlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.98); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 10000; opacity: 1; transition: opacity 0.8s ease; 
        }
        #startOverlay.hidden { opacity: 0; pointer-events: none; }
        #startButton { 
            padding: 20px 50px; font-size: 1.3em; font-family: 'Cormorant Garamond', serif; font-weight: 300; 
            letter-spacing: 3px; background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; cursor: pointer; 
            border-radius: 2px; transition: all 0.4s ease; 
        }
        #startButton:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.5); }

        .video-loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.1);
            border-top-color: rgba(255,255,255,0.5); border-radius: 50%;
            animation: spin 0.8s linear infinite; z-index: 2;
            transition: opacity 0.3s ease;
        }
        .video-loader.hidden { opacity: 0; }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        .viewport { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .state { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; visibility: hidden; 
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; align-items: center; justify-content: center; 
        }
        .state.active { opacity: 1; visibility: visible; pointer-events: auto; }
        .state.fade-out { opacity: 0; transition: opacity 1.1s ease-out; }
        .state.fade-in-slow { animation: fadeInSlow 1.2s ease-in forwards; }
        @keyframes fadeInSlow {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .text-content { 
            font-size: 1.35em; line-height: 2.4; letter-spacing: 0.04em; 
            text-align: center; max-width: 85%; padding: 40px; 
        }
        .text-content .emphasis { font-weight: 500; color: #fff; }

        .video-container { 
            width: 100%; height: 100%; background: #000; overflow: hidden; position: relative; 
        }
        .video-container video {
            width: 100%; height: 100%;
            object-fit: contain;
        }

        .image-frame { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; overflow: hidden; }
        .image-frame img { max-width: 80%; max-height: 75%; object-fit: contain; box-shadow: 0 30px 90px rgba(0,0,0,0.8); transform: scale(1); transform-origin: center center; }
        .state.active .image-frame img { animation: slowZoom 4s ease-out forwards; }
        @keyframes slowZoom {
            from { transform: scale(1); }
            to { transform: scale(2); }
        }

        .tone-execution { background: #08080c; }
        .tone-gunfire { background: #160808; }
        .tone-silence { background: #0a0a0f; }
        .tone-memory-warm { background: #141424; }
        .tone-celebration { background: #1a1a1c; }
        .tone-revelation { background: #0c0c14; }
        .tone-archive { background: #141010; }
        .tone-power-before { background: #160c0c; }
        .tone-aftermath { background: #08080d; }
        .tone-crime-scene { background: #0d0808; }
        .tone-investigation { background: #080d12; }
        .tone-dawn { background: #12121c; }

        .nav-hint { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            font-size: 11px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.2); z-index: 1000; 
        }
        .state-indicator { 
            position: fixed; top: 30px; right: 30px; font-size: 10px; 
            color: rgba(255, 255, 255, 0.2); z-index: 1000; 
        }
        .nav-hint .arrow {
            display: inline-block; animation: bounce 2s ease infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(4px); }
        }
    </style>
</head>
<body>
    <audio id="globalAmbient" loop preload="auto">
        <source src="https://files.catbox.moe/jn29tb.mp3" type="audio/mpeg">
    </audio>

    <div id="startOverlay">
        <button id="startButton">ENTER STORY</button>
    </div>

    <div class="viewport" id="viewport"></div>
    <div class="state-indicator" id="stateIndicator">00 / 23</div>
    <div class="nav-hint"><span class="arrow">↓</span> SCROLL</div>

    <script>
        var R2 = 'https://pub-5e8a0ef5a4644a828651643ce245e258.r2.dev';

        var states = [
            { type: 'video', tone: 'tone-execution',     src: R2 + '/raw-6.mp4' },
            { type: 'text',  tone: 'tone-silence',       text: '<p>There were no screams.</p><p class="emphasis">Only the bewildered gaze of those who could not yet comprehend their own dying.</p>' },
            { type: 'text',  tone: 'tone-memory-warm',   text: '<p class="emphasis">Three hours earlier.</p><p>Candlelight trembled against crystal. Champagne exhaled its gilded breath in quiet bubbles.</p>' },
            { type: 'video', tone: 'tone-celebration',    src: R2 + '/lv_0_20260107152558.mp4' },
            { type: 'text',  tone: 'tone-revelation',    text: '<p>And this prosperity \u2014 upon what foundation did it rest?</p>' },
            { type: 'text',  tone: 'tone-power-before',  text: '<p class="emphasis">The Dalton dynasty. A political aristocracy.</p><p>The grandfather, a veteran senator who shaped legislation for decades. The mother, who ascended to the vice presidency itself.</p><p>There was no door in this nation that would not open at their name.</p>' },
            { type: 'image', tone: 'tone-archive',       imageUrl: 'https://i.ibb.co/8Dw33QxK/nanobana-generated-image-jpg.png' },
            { type: 'text',  tone: 'tone-power-before',  text: '<p>Through every scandal, every tempest, they survived \u2014 shielded by the vast, invisible web of those who owed them favors.</p>' },
            { type: 'text',  tone: 'tone-power-before',  text: '<p>Billions in flood-relief funds, vanished without a trace.</p><p>The blood of countless lives, crushed beneath the weight of their impunity.</p><p class="emphasis">And still, they walked free.</p>' },
            { type: 'text',  tone: 'tone-power-before',  text: '<p>But today \u2014 would that fortune hold?</p>' },
            { type: 'video', tone: 'tone-gunfire',       src: R2 + '/lv_0_20260109225800.mp4' },
            { type: 'text',  tone: 'tone-execution',     text: '<p>Thirty minutes. Forty-seven lives.</p>' },
            { type: 'video', tone: 'tone-crime-scene',   src: R2 + '/raw-3.mp4' },
            { type: 'text',  tone: 'tone-aftermath',     text: '<p>The air hung thick with the scent of iron and gunpowder.</p>' },
            { type: 'text',  tone: 'tone-aftermath',     text: '<p class="emphasis">The entire world held its breath.</p>' },
            { type: 'text',  tone: 'tone-revelation',    text: '<p>Now, nothing would ever be the same.</p>' },
            { type: 'text',  tone: 'tone-aftermath',     text: '<p class="emphasis">One hour later.</p>' },
            { type: 'video', tone: 'tone-investigation', src: R2 + '/lv_0_20260107152639.mp4' },
            { type: 'text',  tone: 'tone-investigation', text: '<p>The machinery of the state lurched into motion. Every force, every authority, bent toward a single question: who did this?</p>' },
            { type: 'text',  tone: 'tone-dawn',          text: '<p>No surveillance. No witnesses. No motive.</p>' },
            { type: 'video', tone: 'tone-investigation', src: R2 + '/raw-10.mp4' },
            { type: 'text',  tone: 'tone-investigation', text: '<p class="emphasis">The rain did not stop.</p>' },
            { type: 'text',  tone: 'execution',          text: '<p>Human life, cheap as weeds trampled underfoot.</p>' },
            { type: 'text',  tone: 'execution',          text: '<p class="emphasis">And this \u2014 was only the beginning.</p>' }
        ];

        var currentIndex = -1;
        var isTransitioning = false;
        var videoElements = {};
        var ambientAudio = document.getElementById('globalAmbient');
        var isWeChat = /MicroMessenger/i.test(navigator.userAgent);

        function init() {
            var viewport = document.getElementById('viewport');
            for (var i = 0; i < states.length; i++) {
                var state = states[i];
                var stateEl = document.createElement('div');
                stateEl.className = 'state';
                stateEl.setAttribute('data-index', i);
                var inner = '<div class="bg ' + state.tone + '"></div>';
                if (state.type === 'text') {
                    inner += '<div class="text-content">' + state.text + '</div>';
                } else if (state.type === 'video') {
                    inner += '<div class="video-container">' +
                        '<div class="video-loader" id="loader_' + i + '"></div>' +
                        '<video id="vid_' + i + '"' +
                        ' playsinline webkit-playsinline' +
                        ' x5-playsinline="true"' +
                        ' x5-video-orientation="portrait"' +
                        ' muted preload="auto"></video>' +
                        '</div>';
                } else if (state.type === 'image') {
                    inner += '<div class="image-frame"><img src="' + state.imageUrl + '" loading="lazy"></div>';
                }
                stateEl.innerHTML = inner;
                viewport.appendChild(stateEl);
                if (state.type === 'video') {
                    videoElements[i] = document.getElementById('vid_' + i);
                }
            }
            document.getElementById('startButton').addEventListener('click', startExperience);
            document.getElementById('startButton').addEventListener('touchend', function(e) {
                e.preventDefault();
                startExperience();
            });
        }

        function preloadAround(index) {
            var range = [index - 1, index, index + 1, index + 2];
            for (var r = 0; r < range.length; r++) {
                var i = range[r];
                if (i < 0 || i >= states.length) continue;
                if (states[i].type !== 'video') continue;
                var vid = videoElements[i];
                if (!vid.getAttribute('src')) {
                    vid.setAttribute('src', states[i].src);
                    vid.load();
                }
            }
        }

        function safePlay(vid, callback) {
            vid.muted = true;
            var playPromise = vid.play();
            if (playPromise !== undefined) {
                playPromise.then(function() {
                    vid.muted = false;
                    if (callback) callback();
                }).catch(function() {
                    var resolved = false;
                    var timeout = setTimeout(function() {
                        if (!resolved) { resolved = true; if (callback) callback(); }
                    }, 8000);
                    vid.addEventListener('canplay', function onCanPlay() {
                        vid.removeEventListener('canplay', onCanPlay);
                        if (resolved) return;
                        clearTimeout(timeout);
                        resolved = true;
                        vid.muted = true;
                        var retry = vid.play();
                        if (retry !== undefined) {
                            retry.then(function() { vid.muted = false; })
                                 .catch(function() {});
                        }
                        if (callback) callback();
                    });
                });
            } else {
                if (callback) callback();
            }
        }

        var started = false;
        function startExperience() {
            if (started) return;
            started = true;

            try { ambientAudio.play(); ambientAudio.volume = 0.3; } catch(e) {}

            var firstVid = videoElements[0];
            if (firstVid) {
                firstVid.setAttribute('src', states[0].src);
                firstVid.load();
                firstVid.muted = true;
                var p = firstVid.play();
                if (p !== undefined) {
                    p.then(function() { firstVid.pause(); }).catch(function(e) {});
                }
            }

            preloadAround(0);
            document.getElementById('startOverlay').classList.add('hidden');
            setTimeout(function() { gotoState(0); }, 300);
        }

        function gotoState(index) {
            if (index < 0 || index >= states.length || isTransitioning) return;
            isTransitioning = true;
            var prevState = currentIndex >= 0 ? states[currentIndex] : null;
            var nextState = states[index];
            if (prevState && prevState.type === 'video' && videoElements[currentIndex]) {
                videoElements[currentIndex].pause();
            }
            var allStates = document.querySelectorAll('.state');
            for (var s = 0; s < allStates.length; s++) {
                allStates[s].classList.remove('active');
                allStates[s].classList.remove('fade-in-slow');
            }
            var activeEl = document.querySelector('[data-index="' + index + '"]');
            activeEl.classList.add('active');
            if (index === 20) { activeEl.classList.add('fade-in-slow'); }
            preloadAround(index);
            if (nextState.type === 'video') {
                if (index === 3) { fadeAmbient(0); } else { fadeAmbient(0.3); }
                var vid = videoElements[index];
                var loader = document.getElementById('loader_' + index);
                var stateEl = activeEl;
                vid.onended = null;
                if (!vid.getAttribute('src')) {
                    vid.setAttribute('src', nextState.src);
                    vid.load();
                }
                if (loader) loader.classList.remove('hidden');
                vid.currentTime = 0;
                safePlay(vid, function() {
                    if (loader) loader.classList.add('hidden');
                    if (index === 20) {
                        var checkTime = setInterval(function() {
                            if (vid.duration && vid.currentTime >= vid.duration - 2) {
                                clearInterval(checkTime);
                                stateEl.style.transition = 'opacity 2s ease-out';
                                stateEl.classList.add('fade-out');
                            }
                        }, 100);
                        vid.onended = function() {
                            clearInterval(checkTime);
                            stateEl.style.transition = '';
                            stateEl.classList.remove('fade-out');
                            if (index < states.length - 1) gotoState(index + 1);
                        };
                    } else {
                        vid.onended = function() {
                            if (index < states.length - 1) {
                                stateEl.style.transition = 'opacity 1.1s ease-out';
                                stateEl.classList.add('fade-out');
                                setTimeout(function() {
                                    stateEl.style.transition = '';
                                    stateEl.classList.remove('fade-out');
                                    gotoState(index + 1);
                                }, 1100);
                            }
                        };
                    }
                });
            } else {
                fadeAmbient(0.3);
            }
            currentIndex = index;
            document.getElementById('stateIndicator').innerText =
                (index < 10 ? '0' : '') + index + ' / ' + (states.length - 1);
            setTimeout(function() { isTransitioning = false; }, 800);
        }

        function fadeAmbient(target) {
            clearInterval(window.fadeInterval);
            window.fadeInterval = setInterval(function() {
                var current = ambientAudio.volume;
                if (Math.abs(current - target) < 0.02) {
                    ambientAudio.volume = target;
                    clearInterval(window.fadeInterval);
                } else {
                    ambientAudio.volume += (target > current ? 0.02 : -0.02);
                }
            }, 50);
        }

        var scrollCooldown = false;
        window.addEventListener('wheel', function(e) {
            if (scrollCooldown) return;
            scrollCooldown = true;
            if (e.deltaY > 0) gotoState(currentIndex + 1);
            else if (e.deltaY < 0) gotoState(currentIndex - 1);
            setTimeout(function() { scrollCooldown = false; }, 1200);
        }, { passive: true });

        var touchStartY = 0;
        window.addEventListener('touchstart', function(e) {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        window.addEventListener('touchend', function(e) {
            var diff = touchStartY - e.changedTouches[0].clientY;
            if (Math.abs(diff) > 50) {
                if (diff > 0) gotoState(currentIndex + 1);
                else gotoState(currentIndex - 1);
            }
        }, { passive: true });

        window.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown' || e.key === ' ') gotoState(currentIndex + 1);
            if (e.key === 'ArrowUp') gotoState(currentIndex - 1);
        });

        if (isWeChat) {
            document.addEventListener('WeixinJSBridgeReady', function() {
                WeixinJSBridge.invoke('getNetworkType', {}, function() {
                    ambientAudio.load();
                    if (videoElements[0]) {
                        videoElements[0].setAttribute('src', states[0].src);
                        videoElements[0].load();
                    }
                });
            }, false);
        }

        init();
    </script>
    </script>
</body>
</html>
